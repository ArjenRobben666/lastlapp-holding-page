<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0b0b0b">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Maybe next time.">
    <title>Last Lapp</title>
    <style>
      :root {
        color-scheme: dark;
        font-synthesis: none;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 48%, rgb(255 255 255 / 2%), transparent 34rem),
          #0b0b0b;
        color: #d8d5cf;
      }

      main {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        place-items: center;
        padding: 2rem;
      }

      p {
        margin: 0;
        font-family: Baskerville, "Iowan Old Style", "Palatino Linotype", Palatino, serif;
        font-size: clamp(0.73rem, 0.7rem + 0.12vw, 0.82rem);
        font-style: italic;
        font-weight: 400;
        letter-spacing: 0.045em;
        line-height: 1;
        opacity: 0;
        text-rendering: optimizeLegibility;
        transform: translateY(0.35rem);
        animation: appear 2.4s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
      }

      @keyframes appear {
        from {
          filter: blur(2px);
          opacity: 0;
          transform: translateY(0.65rem);
        }

        to {
          filter: blur(0);
          opacity: 0.72;
          transform: translateY(0.35rem);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        p {
          animation: none;
          opacity: 0.72;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Maybe next time.</p>
    </main>
  </body>
</html>
